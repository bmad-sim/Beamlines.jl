PALS:
  version: null
  notes:
    - "This file was generated by the `scibmad_to_pals()` function."
    - "Elements that have no `TrackingP` dictionary have `SciBmadStandard` as their tracking method with all parameters equal to false."
  extension_names:
    names:
      - SciBmad
    prefixes:
      - SciBmad_
  facility:
    - BEGELE1:
        kind: BeginningEle
        ReferenceP:
          species_ref: proton
          E_tot_ref: 70
    - drift_A:
        kind: Drift
        length: 0.25
    - quad_A:
        kind: Quadrupole
        length: 1.0
        MagneticMultipoleP:
          Bn1: 1.0
    - drift_B:
        kind: Drift
        length: 0.5
    - quad_B:
        kind: Quadrupole
        length: 1.0
        MagneticMultipoleP:
          Bn1: -1.0
    - beamline1:
        kind: Beamline
        line:
          - BEGELE1
          - drift_A
          - quad_A
          - drift_B
          - quad_B
          - drift_A
    - drift_C:
        kind: Drift
        length: 0.25
        ReferenceChangeP:
          dE_ref: 35
    - quad_C:
        kind: Quadrupole
        length: 1.0
        MagneticMultipoleP:
          Bn1: 1.0
    - drift_D:
        kind: Drift
        length: 0.5
    - quad_D:
        kind: Quadrupole
        length: 1.0
        MagneticMultipoleP:
          Bn1: -1.0
    - beamline2:
        kind: Beamline
        line:
          - drift_C
          - quad_C
          - drift_D
          - quad_D
          - drift_C
    - masterbeamline:
        kind: Beamline
        line:
          - beamline1
          - beamline2
    - lattice:
        kind: Lattice
        branches:
          - masterbeamline
    - use: lattice
